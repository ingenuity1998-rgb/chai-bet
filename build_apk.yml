name: Build Android APK & Release Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows 1-click manual build from GitHub Actions tab

jobs:
  build:
    name: Compile Chai Bet App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build Release Bundle (AAB)
        run: |
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK (For direct phone install)
        uses: actions/upload-artifact@v4
        with:
          name: ChaiBet-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release AAB (For Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: ChaiBet-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
